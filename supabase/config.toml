project_id = "portfolio-kanban"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.migrations]
enabled = true

[db.seed]
enabled = false

[studio]
enabled = true
port = 54323

# Evita depender de la API TCP de Docker para recolectar logs en Windows.
[analytics]
enabled = false

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = []
enable_signup = false
enable_anonymous_sign_ins = false

[auth.email]
# Activa el proveedor de correo; [auth].enable_signup=false bloquea el registro.
enable_signup = true
enable_confirmations = true

[auth.sms]
enable_signup = false
